# Audit Pulse — research source library
#
# This file is the single source of truth for which outlets the n8n
# "Audit Pulse — News Engine" workflow searches across when finding the
# day's audit / accounting / adjacent stories. It is read by humans and
# injected into the grounded-research AI prompt; it is NOT polled as a
# set of RSS feeds (many entries are standards-body sites that rarely
# change — coverage comes from grounded web search + per-URL verification).
#
# Scope: this is the FULL research scope, which intentionally includes
# competitor / audit-tech-vendor sites (Caseware, DataSnipper, MindBridge,
# etc.) so the engine can spot product news the profession cares about.
# The public-facing /news/sources page uses a curated subset in
# lib/news-sources.ts that excludes competitors.
#
# To add a source: append under the right group with name + url; add an
# optional `region` or `notes` field if useful. Source ≠ fixed category;
# the AI tags each STORY into one of the 6 categories per-story.
#
# Total: 62 entries (44 from the original library + 13 new + 5 sub-page
# splits — AccountingWEB UK vs US, Accountancy Europe top-level vs Audit
# vs Sustainability updates, IFAC AI hub, ISACA Shadow AI — each is a
# real distinct URL worth searching).
# Spec: ~/.claude/plans/2026-05-27-audit-pulse-n8n-engine-design.md

